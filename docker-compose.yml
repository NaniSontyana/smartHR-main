version: '3.8'

services:
  # Python ML Microservice
  ml-service:
    build:
      context: ./employee-ML
      dockerfile: Dockerfile
    container_name: retainiq-ml
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - retainiq-net

  # Express.js Core Backend
  backend:
    build:
      context: ./employee-backend
      dockerfile: Dockerfile
    container_name: retainiq-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - ml-service
      - mongodb
      - redis
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb+srv://nanisontyana47_db_user:nani@cluster0.p4l3bw7.mongodb.net/?appName=Cluster0
      - JWT_SECRET=retainiq_super_secret_production_key_2026
      - ML_API_URL=http://ml-service:5000/predict
      - CLIENT_URL=http://localhost:80,http://localhost:5173,http://localhost:8080
      - REDIS_URL=redis://redis:6379
    networks:
      - retainiq-net

  # React Frontend (Nginx SPA)
  frontend:
    build:
      context: ./smarthr-attritionrediction-main
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
    container_name: retainiq-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - retainiq-net

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: retainiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - retainiq-net

  # Local MongoDB Service (Self-contained offline development)
  mongodb:
    image: mongo:6.0
    container_name: retainiq-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - retainiq-net

networks:
  retainiq-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
