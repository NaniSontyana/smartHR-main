##############################################################################
# RetainIQ™ Node.js Backend — Kubernetes Deployment
# Express.js + Socket.io + Redis cache layer
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: retainiq
  labels:
    app: backend
    tier: api
    app.kubernetes.io/name: retainiq-backend
spec:
  replicas: 3                          # 3 replicas per region for HA
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        tier: api
      annotations:
        # Restart pods when secret changes
        checksum/secrets: "{{ include (print $.Template.BasePath \"/secrets.yaml\") . | sha256sum }}"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
      # Graceful shutdown — wait for in-flight requests
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: REGISTRY/retainiq-backend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: retainiq-secrets
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: ML_API_URL
              value: "http://ml-service:5000"
            - name: CLIENT_URL
              value: "https://app.retainiq.io"
            # Region is injected per-overlay (us-east1, eu-west1, etc.)
            - name: REGION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['region']
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: retainiq
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: retainiq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
