##############################################################################
# RetainIQ™ — Kubernetes Secrets
# IMPORTANT: Replace placeholder values before applying.
# In production, use external secrets (Vault, AWS Secrets Manager, GCP Secret Manager).
# Base64-encode values:  echo -n "my-value" | base64
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: retainiq-secrets
  namespace: retainiq
type: Opaque
stringData:
  # MongoDB Atlas connection string
  MONGO_URI: "mongodb+srv://<user>:<pass>@cluster0.p4l3bw7.mongodb.net/?appName=Cluster0"
  # JWT signing key (use a 256-bit random string in production)
  JWT_SECRET: "retainiq_super_secret_production_key_change_me"
  # Redis connection (use Upstash or Redis Cloud for multi-region)
  REDIS_URL: "rediss://:<password>@<host>:<port>"
  # Email SMTP
  EMAIL_USER: "your-email@gmail.com"
  EMAIL_PASS: "your-app-password"
