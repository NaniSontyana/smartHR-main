##############################################################################
# Kustomize base — shared resources for all regions
##############################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retainiq

resources:
  - namespace.yaml
  - secrets.yaml
  - ml-deployment.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml

# Common labels applied to ALL resources
commonLabels:
  app.kubernetes.io/part-of: retainiq
  app.kubernetes.io/managed-by: kustomize
