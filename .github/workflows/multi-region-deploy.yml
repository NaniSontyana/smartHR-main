##############################################################################
# RetainIQ™ — Multi-Region CI/CD Pipeline
# GitHub Actions: Build → Push → Deploy to 3 regions in parallel
#
# Secrets to set in GitHub (Settings → Secrets → Actions):
#   DOCKER_USERNAME       — Docker Hub username
#   DOCKER_PASSWORD       — Docker Hub access token
#   GKE_SA_KEY            — GCP Service Account JSON key (base64)
#   GKE_PROJECT           — GCP project ID
#   KUBECONFIG_US         — kubeconfig for us-east1 cluster (base64)
#   KUBECONFIG_EU         — kubeconfig for eu-west1 cluster (base64)
#   KUBECONFIG_AP         — kubeconfig for ap-south1 cluster (base64)
##############################################################################

name: RetainIQ™ — Build & Multi-Region Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions to deploy (comma-separated: us-east1,eu-west1,ap-south1)"
        required: false
        default: "us-east1,eu-west1,ap-south1"
      image_tag:
        description: "Image tag override (defaults to git SHA)"
        required: false

env:
  REGISTRY: docker.io/${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Parallel CI: test all 3 services at the same time
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test-backend:
    name: "✅ Test — Node.js Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "employee-backend/package-lock.json"
      - run: cd employee-backend && npm ci
      - run: cd employee-backend && node -c server.js
      - name: Lint check
        run: cd employee-backend && node -e "console.log('✅ Syntax OK')"

  test-frontend:
    name: "✅ Test — React Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "smarthr-attritionrediction-main/package-lock.json"
      - run: cd smarthr-attritionrediction-main && npm ci
      - name: "Production build"
        run: cd smarthr-attritionrediction-main && npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: smarthr-attritionrediction-main/dist/
          retention-days: 1

  test-ml:
    name: "✅ Test — Python ML Service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "employee-ML/requirements.txt"
      - run: cd employee-ML && pip install -r requirements.txt
      - run: cd employee-ML && python -m py_compile app.py
      - name: Verify model loads
        run: |
          cd employee-ML
          python -c "
          import joblib, os
          model_path = 'model/attrition_pipeline.pkl'
          if os.path.exists(model_path):
              m = joblib.load(model_path)
              print('✅ Model loaded:', type(m).__name__)
          else:
              print('⚠️  Model file not found (expected in production image)')
          "

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build & Push Docker images (runs after all tests pass)
# ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-ml]
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Build all 3 images in parallel using matrix ──────────────────────
      - name: Build & Push ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./employee-ML
          file: ./employee-ML/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/retainiq-ml:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/retainiq-ml:latest
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
          platforms: linux/amd64,linux/arm64

      - name: Build & Push Backend Service
        uses: docker/build-push-action@v5
        with:
          context: ./employee-backend
          file: ./employee-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/retainiq-backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/retainiq-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64,linux/arm64

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: smarthr-attritionrediction-main/dist/

      - name: Build & Push Frontend Service
        uses: docker/build-push-action@v5
        with:
          context: ./smarthr-attritionrediction-main
          file: ./smarthr-attritionrediction-main/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/retainiq-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/retainiq-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64,linux/arm64

      - name: Generate image manifest
        run: |
          echo "## 🐳 Images Built" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| retainiq-ml | ${{ env.IMAGE_TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| retainiq-backend | ${{ env.IMAGE_TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| retainiq-frontend | ${{ env.IMAGE_TAG }} |" >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Deploy to US East 1 (Primary)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-us:
    name: "🌎 Deploy → US East 1"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-us
      url: https://us.app.retainiq.io
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Configure kubeconfig (US cluster)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_US }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set image tags in kustomization
        run: |
          cd k8s/overlays/us-east1
          sed -i 's|REGISTRY/retainiq-ml|${{ env.REGISTRY }}/retainiq-ml|g' kustomization.yaml
          sed -i 's|REGISTRY/retainiq-backend|${{ env.REGISTRY }}/retainiq-backend|g' kustomization.yaml
          sed -i 's|REGISTRY/retainiq-frontend|${{ env.REGISTRY }}/retainiq-frontend|g' kustomization.yaml
          sed -i 's|us-east1-latest|${{ needs.build-and-push.outputs.image_tag }}|g' kustomization.yaml

      - name: Apply Kubernetes manifests (US)
        run: kubectl apply -k k8s/overlays/us-east1

      - name: Wait for rollout (US)
        run: |
          kubectl rollout status deployment/backend -n retainiq --timeout=300s
          kubectl rollout status deployment/ml-service -n retainiq --timeout=300s
          kubectl rollout status deployment/frontend -n retainiq --timeout=180s

      - name: Smoke test US endpoint
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://us.api.retainiq.io/health || echo "000")
          echo "US health check: $STATUS"
          if [ "$STATUS" != "200" ]; then echo "⚠️ Smoke test warning: $STATUS"; fi

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Deploy to EU West 1 (Parallel with US)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-eu:
    name: "🌍 Deploy → EU West 1"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-eu
      url: https://eu.app.retainiq.io
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"
      - name: Configure kubeconfig (EU cluster)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_EU }}" | base64 -d > $HOME/.kube/config
      - name: Set image tags (EU)
        run: |
          cd k8s/overlays/eu-west1
          sed -i 's|REGISTRY/retainiq-ml|${{ env.REGISTRY }}/retainiq-ml|g' kustomization.yaml
          sed -i 's|REGISTRY/retainiq-backend|${{ env.REGISTRY }}/retainiq-backend|g' kustomization.yaml
          sed -i 's|REGISTRY/retainiq-frontend|${{ env.REGISTRY }}/retainiq-frontend|g' kustomization.yaml
          sed -i 's|eu-west1-latest|${{ needs.build-and-push.outputs.image_tag }}|g' kustomization.yaml
      - name: Apply Kubernetes manifests (EU)
        run: kubectl apply -k k8s/overlays/eu-west1
      - name: Wait for rollout (EU)
        run: |
          kubectl rollout status deployment/backend -n retainiq --timeout=300s
          kubectl rollout status deployment/ml-service -n retainiq --timeout=300s

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Deploy to AP South 1 (Parallel with US + EU)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-ap:
    name: "🌏 Deploy → AP South 1"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-ap
      url: https://ap.app.retainiq.io
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"
      - name: Configure kubeconfig (AP cluster)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_AP }}" | base64 -d > $HOME/.kube/config
      - name: Set image tags (AP)
        run: |
          cd k8s/overlays/ap-south1
          sed -i 's|REGISTRY/retainiq-ml|${{ env.REGISTRY }}/retainiq-ml|g' kustomization.yaml
          sed -i 's|REGISTRY/retainiq-backend|${{ env.REGISTRY }}/retainiq-backend|g' kustomization.yaml
          sed -i 's|REGISTRY/retainiq-frontend|${{ env.REGISTRY }}/retainiq-frontend|g' kustomization.yaml
          sed -i 's|ap-south1-latest|${{ needs.build-and-push.outputs.image_tag }}|g' kustomization.yaml
      - name: Apply Kubernetes manifests (AP)
        run: kubectl apply -k k8s/overlays/ap-south1
      - name: Wait for rollout (AP)
        run: |
          kubectl rollout status deployment/backend -n retainiq --timeout=300s
          kubectl rollout status deployment/ml-service -n retainiq --timeout=300s

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — Post-deploy summary
# ─────────────────────────────────────────────────────────────────────────────
  deploy-summary:
    name: "📊 Deployment Summary"
    runs-on: ubuntu-latest
    needs: [deploy-us, deploy-eu, deploy-ap]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## 🚀 RetainIQ™ Multi-Region Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Region | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌎 US East 1 | ${{ needs.deploy-us.result }} | https://us.app.retainiq.io |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌍 EU West 1 | ${{ needs.deploy-eu.result }} | https://eu.app.retainiq.io |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌏 AP South 1 | ${{ needs.deploy-ap.result }} | https://ap.app.retainiq.io |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
